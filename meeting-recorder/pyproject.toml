[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetnotes"
version = "0.1.0"
description = "Graba el audio de tu computadora (Teams, Meet, Zoom, incógnito...) y genera apuntes y mejoras personales."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
capture = ["soundcard>=0.4.3"]
transcribe = ["faster-whisper>=1.0"]
notes = ["anthropic>=0.40"]
all = ["soundcard>=0.4.3", "faster-whisper>=1.0", "anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
meetnotes = "meetnotes.cli:main"

[tool.setuptools]
packages = ["meetnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
